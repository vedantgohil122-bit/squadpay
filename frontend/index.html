<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SquadPay" />
    <meta name="application-name" content="SquadPay" />
    <meta name="msapplication-TileColor" content="#f5a623" />
    <meta name="msapplication-config" content="none" />
    <meta name="msapplication-starturl" content="/app" />
    
    <!-- Cross-platform -->
    <meta name="format-detection" content="telephone=no" />
    <meta name="color-scheme" content="dark light" />
    <meta name="supported-color-schemes" content="dark light" />

    <!-- SEO Meta -->
    <title>SquadPay — Track Expenses. Save Friendships.</title>
    <meta name="description" content="The fun way to split bills, trips, food runs, and squad chaos. Offline-ready, cross-platform, with dark/light mode and real-time notifications." />
    <meta name="theme-color" content="#0e0c0a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fdf8ec" media="(prefers-color-scheme: light)" />
    <meta name="keywords" content="expense tracker, bill split, squad, PWA, offline, dark mode, India, Splitwise alternative" />

    <!-- Open Graph (WhatsApp/Instagram preview) -->
    <meta property="og:title" content="SquadPay — Track Expenses. Save Friendships." />
    <meta property="og:description" content="Squad ka official finance department. Bill split karo, friendship nahi. Now with offline, notifications, and light mode." />
    <meta property="og:image" content="/icon-512.png" />
    <meta property="og:url" content="https://mysquadpay.vercel.app" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="SquadPay" />
    <meta name="twitter:description" content="Squad ka official finance department — offline, cross-platform, dark/light." />
    <meta name="twitter:image" content="/icon-512.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

    <!-- Preload critical -->
    <link rel="preload" href="/icon-192.png" as="image" />

    <!-- Platform independent styles for install prompt -->
    <style>
      /* Avoid FOUC — set bg immediately from theme */
      html { background: #0e0c0a; }
      html[data-theme='light'] { background: #fdf8ec; }
      /* Windows High Contrast */
      @media (forced-colors: active) {
        .bcard { border: 2px solid CanvasText; }
      }
      /* Reduce motion */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
      }
    </style>
    <script>
      // Fast theme apply before React to avoid flash
      (function() {
        try {
          var t = localStorage.getItem('squadpay_theme');
          if (!t) t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', t);
          document.documentElement.style.colorScheme = t;
        } catch {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <noscript>
      <div style="padding:2rem;text-align:center;font-family:system-ui">
        <h1>SquadPay needs JavaScript — bhai JS on karo 🙏</h1>
        <p>This app is a PWA and requires JavaScript for offline, notifications and theme support.</p>
      </div>
    </noscript>
  </body>
</html>
